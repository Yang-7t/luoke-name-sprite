<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>洛克王国：世界 - 你的本命精灵</title>
    <meta name="description" content="输入你的名字，在洛克王国世界中找到属于你的本命精灵！">
    <meta property="og:title" content="洛克王国：世界 - 你的本命精灵">
    <meta property="og:description" content="输入你的名字，发现与你命运相连的精灵伙伴！">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%23FF8BA7'/><stop offset='100%25' style='stop-color:%237EC8E3'/></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23g)'/><text y='.72em' font-size='55' text-anchor='middle' fill='white'>✦</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 魔法粒子装饰 -->
    <div class="magic-particles" aria-hidden="true" id="particles"></div>

    <!-- 背景星星装饰 -->
    <div class="bg-stars" aria-hidden="true">
        <span class="bg-star s1">✦</span>
        <span class="bg-star s2">✧</span>
        <span class="bg-star s3">✦</span>
        <span class="bg-star s4">✧</span>
        <span class="bg-star s5">✦</span>
        <span class="bg-star s6">✧</span>
    </div>

    <!-- 主容器 -->
    <main class="container">
        <!-- 输入页面 -->
        <section id="input-page" class="page active">
            <!-- 罗盘Logo -->
            <div class="compass-logo">
                <div class="compass-outer"></div>
                <div class="compass-inner">
                    <span class="compass-star">✦</span>
                </div>
            </div>

            <div class="journal-card input-card">
                <div class="card-tape"></div>
                <div class="card-content">
                    <h1 class="game-title">洛克王国：世界</h1>
                    <p class="game-subtitle">~ Roco Kingdom World ~</p>
                    <div class="divider">
                        <span class="divider-star">✦</span>
                    </div>
                    <p class="input-prompt">在魔法罗盘的指引下<br>寻找与你命运交织的精灵伙伴</p>
                    <div class="input-group">
                        <input
                            type="text"
                            id="name-input"
                            class="name-input"
                            placeholder="写下你的名字..."
                            maxlength="20"
                            autocomplete="off"
                        >
                        <div class="input-decoration">
                            <span class="input-star left">✦</span>
                            <span class="input-star right">✦</span>
                        </div>
                    </div>
                    <button id="submit-btn" class="magic-btn" onclick="onSubmit()">
                        <span class="btn-text">启动罗盘</span>
                        <span class="btn-sparkles">
                            <span>✦</span><span>✧</span><span>✦</span>
                        </span>
                    </button>
                </div>
                <div class="card-corner tl"></div>
                <div class="card-corner tr"></div>
                <div class="card-corner bl"></div>
                <div class="card-corner br"></div>
            </div>
            <p class="hint-text">✧ 同一名字永远指向同一精灵 ✧</p>
        </section>

        <!-- 结果页面 -->
        <section id="result-page" class="page">
            <div class="journal-card result-card">
                <div class="card-tape"></div>
                <div class="card-content">
                    <p class="result-label">命运的罗盘指向了</p>
                    <h2 id="result-name-display" class="result-name-display"></h2>
                    <div class="divider">
                        <span class="divider-star">✦</span>
                    </div>

                    <!-- 精灵展示 -->
                    <div class="sprite-frame">
                        <div class="sprite-ring"></div>
                        <div class="sprite-glow"></div>
                        <div id="sprite-avatar" class="sprite-avatar">
                            <span class="sprite-emoji"></span>
                        </div>
                        <img id="sprite-image" class="sprite-image" src="" alt="精灵图片" style="display:none">
                        <div class="sprite-star-deco s1">✦</div>
                        <div class="sprite-star-deco s2">✧</div>
                        <div class="sprite-star-deco s3">✦</div>
                    </div>

                    <h2 id="sprite-name" class="sprite-name"></h2>
                    <span id="sprite-element" class="element-badge"></span>
                    <p id="sprite-desc" class="sprite-desc"></p>

                    <div class="result-actions">
                        <button class="action-btn retry-btn" onclick="onRetry()">
                            <span class="btn-icon">↺</span>
                            <span>重新占卜</span>
                        </button>
                        <button class="action-btn share-btn" onclick="onShare()">
                            <span class="btn-icon">✦</span>
                            <span>分享羁绊</span>
                        </button>
                    </div>
                </div>
                <div class="card-corner tl"></div>
                <div class="card-corner tr"></div>
                <div class="card-corner bl"></div>
                <div class="card-corner br"></div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
